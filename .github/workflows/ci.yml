name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Bun installs the workspace (frozen lockfile); the matrix Nodes run the
      # tests. Node 24 was previously excluded for reported yoga-layout WASM /
      # Buffer issues, but the full suite (2123 engine + 48 renderer + 3
      # markdown tests, build, and all smokes) was verified green on both
      # 22.18.0 and 24.16.0 with vitest 1.6.1 (see ticket 09).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile
      - run: bun run test:engine:run
      - run: bun run test:renderer:run
      - run: bun run test:markdown:run
      - run: bun run build
      - run: bun run --cwd packages/engine smoke
      - run: bun run --cwd packages/renderer smoke
      - run: bun run --cwd packages/markdown smoke
